version: "3.8"

services:
  postgres:
  image: postgres:15
  environment:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: shopapp
  volumes:
  - shopapp_db_data:/var/lib/postgresql/data
  ports:
  - "6543:5432"

redis:
  image: redis:7
  command: ["redis-server", "--save", "60", "1"]
  ports:
  - "6379:6379"
  volumes:
  - shopapp_redis_data:/data

backend:
  build:
  context: ./backend
  dockerfile: Dockerfile
  environment:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:6543/shopapp?schema=public"
  REDIS_URL: "redis://redis:6379"
  NODE_ENV: development
  depends_on:
  - postgres
  - redis
  ports:
  - "4000:4000"
  volumes:
  - ./backend:/usr/src/app
  command: ["sh", "-c", "npm run prisma:deploy && npm run start:dev"]

worker:
  build:
  context: ./backend
  dockerfile: Dockerfile
  environment:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:6543/shopapp?schema=public"
  REDIS_URL: "redis://redis:6379"
  NODE_ENV: development
  depends_on:
  - postgres
  - redis
  volumes:
  - ./backend:/usr/src/app
  command: ["sh", "-c", "npm run prisma:deploy && npm run worker"]

frontend:
  build:
    context: ./frontend
    dockerfile: Dockerfile
  ports:
  - "3000:3000"
  environment:
    NEXT_PUBLIC_WS_URL: "ws://localhost:4000"
  volumes:
  - ./frontend:/usr/src/app
  depends_on:
  - backend

volumes:
  shopapp_db_data:
  shopapp_redis_data:
