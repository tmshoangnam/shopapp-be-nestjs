<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopApp Chat - Client</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/chat.css">
    <link rel="stylesheet" href="styles/client.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-content">
                <div class="user-info">
                    <div class="avatar">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMjAiIGZpbGw9IiM2MzY2ZjEiLz4KPGNpcmNsZSBjeD0iMjAiIGN5PSIxNiIgcj0iNiIgZmlsbD0id2hpdGUiLz4KPHBhdGggZD0iTTEwIDMwQzEwIDI1IDx0IDIwIDIwQzE1IDIwIDEwIDI1IDEwIDMwWiIgZmlsbD0id2hpdGUiLz4KPC9zdmc+Cg==" alt="Avatar" id="userAvatar">
                    </div>
                    <div class="user-details">
                        <h3 id="userName">Nguyễn Văn A</h3>
                        <span class="status" id="userStatus">
                            <i class="fas fa-circle"></i>
                            Đang hoạt động
                        </span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" id="settingsBtn" title="Cài đặt">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button class="btn-icon" id="minimizeBtn" title="Thu nhỏ">
                        <i class="fas fa-minus"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Chat Content -->
        <div class="chat-content">
            <!-- Sidebar -->
            <aside class="chat-sidebar">
                <div class="sidebar-header">
                    <h2>Trò chuyện</h2>
                    <button class="btn-icon" id="newChatBtn" title="Cuộc trò chuyện mới">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                
                <div class="search-box">
                    <input type="text" placeholder="Tìm kiếm cuộc trò chuyện..." id="searchInput">
                    <i class="fas fa-search"></i>
                </div>

                <div class="conversations-list" id="conversationsList">
                    <!-- Conversations will be loaded here -->
                </div>
            </aside>

            <!-- Main Chat Area -->
            <main class="chat-main">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-content">
                        <div class="welcome-icon">
                            <i class="fas fa-comments"></i>
                        </div>
                        <h2>Chào mừng đến với ShopApp Chat</h2>
                        <p>Chọn một cuộc trò chuyện để bắt đầu hoặc tạo cuộc trò chuyện mới</p>
                        <button class="btn-primary" id="startChatBtn">
                            <i class="fas fa-plus"></i>
                            Bắt đầu trò chuyện
                        </button>
                    </div>
                </div>

                <!-- Chat Window -->
                <div class="chat-window" id="chatWindow" style="display: none;">
                    <!-- Chat Header -->
                    <div class="chat-window-header">
                        <div class="chat-partner-info">
                            <div class="avatar">
                                <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTYiIGZpbGw9IiNmNTkzNzUiLz4KPGNpcmNsZSBjeD0iMTYiIGN5PSIxMiIgcj0iNSIgZmlsbD0id2hpdGUiLz4KPHBhdGggZD0iTTggMjRDOCAyMCAxMCAxNiAxNiAxNkMyMiAxNiAyNCAyMCAyNCAyNFoiIGZpbGw9IndoaXRlIi8+Cjwvc3ZnPgo=" alt="Admin Avatar" id="partnerAvatar">
                            </div>
                            <div class="partner-details">
                                <h4 id="partnerName">Admin Support</h4>
                                <span class="partner-status" id="partnerStatus">
                                    <i class="fas fa-circle"></i>
                                    Đang hoạt động
                                </span>
                            </div>
                        </div>
                        <div class="chat-actions">
                            <button class="btn-icon" id="voiceCallBtn" title="Gọi thoại">
                                <i class="fas fa-phone"></i>
                            </button>
                            <button class="btn-icon" id="videoCallBtn" title="Gọi video">
                                <i class="fas fa-video"></i>
                            </button>
                            <button class="btn-icon" id="chatInfoBtn" title="Thông tin">
                                <i class="fas fa-info-circle"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Messages Area -->
                    <div class="messages-container" id="messagesContainer">
                        <div class="messages-list" id="messagesList">
                            <!-- Messages will be loaded here -->
                        </div>
                        
                        <!-- Typing Indicator -->
                        <div class="typing-indicator" id="typingIndicator" style="display: none;">
                            <div class="typing-dots">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <span class="typing-text">Admin đang nhập...</span>
                        </div>
                    </div>

                    <!-- Message Input -->
                    <div class="message-input-container">
                        <div class="message-input-wrapper">
                            <button class="btn-icon" id="attachBtn" title="Đính kèm file">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <button class="btn-icon" id="emojiBtn" title="Emoji">
                                <i class="far fa-smile"></i>
                            </button>
                            <div class="input-wrapper">
                                <textarea 
                                    id="messageInput" 
                                    placeholder="Nhập tin nhắn..."
                                    rows="1"
                                ></textarea>
                            </div>
                            <button class="btn-send" id="sendBtn" title="Gửi tin nhắn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Đang kết nối...</p>
            </div>
        </div>
    </div>

    <!-- File Upload Modal -->
    <div class="modal" id="fileUploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Đính kèm file</h3>
                <button class="btn-close" id="closeFileModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Kéo thả file vào đây hoặc <span>chọn file</span></p>
                    <input type="file" id="fileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx">
                </div>
                <div class="uploaded-files" id="uploadedFiles"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelUpload">Hủy</button>
                <button class="btn-primary" id="confirmUpload">Gửi</button>
            </div>
        </div>
    </div>

    <!-- Connection Status Toast -->
    <div class="toast" id="connectionToast">
        <div class="toast-content">
            <i class="fas fa-wifi"></i>
            <span id="connectionMessage">Đã kết nối</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.7.0/socket.io.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/chat-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
